# Déploiement sur Render (https://render.com) : New → Blueprint → choisir ce dépôt.
services:
  - type: web
    name: soiree-jeux
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /jouer
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      # Sauvegarde en ligne (facultatif mais conseillé) : base Upstash Redis gratuite
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
