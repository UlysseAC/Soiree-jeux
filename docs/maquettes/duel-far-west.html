<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duel au Far West</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#17110c; --bg2:#20180f; --card:#2a1f14; --line:#4a3824; --line2:#6b5233;
  --bone:#f0e3c8; --dust:#b49d7b; --brass:#e0a940; --brass-soft:rgba(224,169,64,.16);
  --up:#5cc47a; --up-soft:rgba(92,196,122,.16); --down:#e2574c; --down-soft:rgba(226,87,76,.16);
  --west:"Rye", "Rockwell", Georgia, serif;
  --cond:"Barlow Condensed", "Arial Narrow", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
body{background:var(--bg);color:var(--bone);font:16px/1.4 var(--cond);padding:20px 16px 40px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.note{color:var(--dust);font-size:15px;margin:0;max-width:75ch}
.btn{font:600 16px var(--cond);letter-spacing:.04em;text-transform:uppercase;background:var(--brass);color:#22170a;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--bone);border:1px solid var(--line2)}
.btn:focus-visible{outline:2px solid var(--bone);outline-offset:2px}

.screen{background:radial-gradient(ellipse at 30% 0%,#2b1f12,var(--bg2) 60%);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,330px);gap:22px}
.head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.title{font:400 clamp(28px,3.6vw,46px)/1 var(--west);color:var(--brass);margin:0;letter-spacing:.01em}
.live{display:flex;align-items:center;gap:12px;font:700 clamp(18px,2vw,26px)/1.1 var(--cond);text-transform:uppercase;letter-spacing:.03em}
.live .tag{font:700 12px var(--mono);letter-spacing:.1em;color:#22170a;background:var(--brass);padding:4px 8px;border-radius:4px}
.live .vs{color:var(--brass);font-family:var(--west);font-size:.9em}

/* Arbre */
.bracketWrap{overflow-x:auto;min-width:0}
.bracket{position:relative;display:grid;grid-template-columns:repeat(5,minmax(128px,1fr));gap:26px;min-width:720px}
.bracket svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.colhead{display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
.colhead b{font:700 14px var(--cond);text-transform:uppercase;letter-spacing:.1em;color:var(--dust)}
.prime{font:700 20px var(--mono);color:var(--brass)}
.prime small{font:500 11px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--dust);margin-left:4px}
.slots{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:6px}
.duel{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;background:var(--card);overflow:hidden;transition:border-color .3s,box-shadow .3s}
.duel.cur{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass-soft),0 0 18px rgba(224,169,64,.25)}
.p{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 8px;font:600 15px/1.2 var(--cond);min-height:22px}
.p + .p{border-top:1px solid var(--line)}
.p .n{font:500 11px var(--mono);color:var(--dust)}
.p.win{color:var(--bone)} .p.win .name::after{content:" ✓";color:var(--brass)}
.p.lose{color:var(--dust);opacity:.55;text-decoration:line-through}
.p.tbd{color:var(--dust);opacity:.6}
.champ{border:1px solid var(--brass);border-radius:10px;padding:14px 10px;text-align:center;background:var(--brass-soft)}
.champ .name{font:400 22px/1.1 var(--west);color:var(--brass)}
.champ.empty .name{font:600 18px var(--cond);color:var(--dust)}
.phase{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brass);background:var(--brass-soft);border-radius:4px;padding:2px 6px;align-self:flex-start}

/* Parieurs */
.bets{display:flex;flex-direction:column;gap:10px;min-width:0}
.bets h2{font:400 24px/1 var(--west);margin:0;color:var(--bone)}
.bets .sub{font:500 13px var(--cond);color:var(--dust);letter-spacing:.06em;text-transform:uppercase}
.board{position:relative;display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto 54px;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;transition:background-color .6s,border-color .6s}
.row.up{background:var(--up-soft);border-color:rgba(92,196,122,.5)}
.row.down{background:var(--down-soft);border-color:rgba(226,87,76,.5)}
.rk{font:700 15px var(--mono);color:var(--dust);text-align:right}
.nm{font:600 18px/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font:700 15px var(--mono);color:var(--brass);font-variant-numeric:tabular-nums;text-align:right}
.delta{font:700 13px var(--mono);text-align:right;opacity:0;transition:opacity .4s}
.delta.show{opacity:1}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}
.row:nth-child(1) .rk{color:var(--brass)}

@media (max-width:900px){
  .screen{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.row,.duel{transition:none!important}}
</style>

<div class="wrap">
  <div class="bar">
    <p class="note">Maquette de l'écran public du jeu 2, avec des données d'exemple (32 inscrits, 16 survivants après le tour 1). Clique sur « Fin du duel » pour simuler un résultat : l'arbre avance et le classement des parieurs se réordonne.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="next">Fin du duel ▶</button>
      <button class="btn ghost" id="reset">Recommencer</button>
    </div>
  </div>

  <div class="screen">
    <div class="head">
      <h1 class="title">Duel au Far West</h1>
      <div class="live" id="live"></div>
    </div>

    <div class="bracketWrap">
      <div class="bracket" id="bracket">
        <svg id="wires" aria-hidden="true"></svg>
      </div>
    </div>

    <aside class="bets">
      <div><h2>Les parieurs</h2><div class="sub">Gains des paris · joueurs éliminés</div></div>
      <ol class="board" id="board"></ol>
    </aside>
  </div>
</div>

<script>
const ROUNDS=[
  {name:'Tour 2',prime:200,phase:'Numéros'},
  {name:'Quarts',prime:400,phase:'Face-à-face'},
  {name:'Demies',prime:800,phase:'Face-à-face'},
  {name:'Finale',prime:1600,phase:'Face-à-face'},
];
const WIN_PRIME=3200;
const START=[['Charlotte',47],['Arthur',18],['Léo',73],['Inès',29],['Hugo',61],['Maëlys',35],['Karim',82],['Jade',14],
             ['Tom',56],['Sarah',91],['Nico',23],['Lina',68],['Rayan',40],['Zoé',77],['Adam',52],['Manon',39]];
const BETTORS=['Emma','Louis','Nora','Malik','Rose','Hamza','Lou','Ethan','Clara','Victor','Eva','Mehdi'];
let state;

function init(){
  // rounds[r] = tableau de duels [{a,b,w}] ; a/b = index joueur ou null
  const r0=[];for(let i=0;i<8;i++)r0.push({a:2*i,b:2*i+1,w:null});
  state={players:START.map(([n,num])=>({n,num})),rounds:[r0,[],[],[]],champ:null,
    bettors:BETTORS.map((n,i)=>({n,amt:[560,540,500,470,430,390,360,320,290,260,220,180][i],delta:0}))};
  for(let r=1;r<4;r++)for(let i=0;i<8>>r;i++)state.rounds[r].push({a:null,b:null,w:null});
  // 5 duels déjà joués au tour 2
  [0,1,0,1,0].forEach((side,i)=>resolve(0,i,side,true));
  render(true);
}
function current(){
  for(let r=0;r<4;r++)for(let i=0;i<state.rounds[r].length;i++){const d=state.rounds[r][i];if(d.w===null&&d.a!==null&&d.b!==null)return[r,i]}
  return null;
}
function resolve(r,i,side,silent){
  const d=state.rounds[r][i];d.w=side===0?d.a:d.b;
  if(r<3){const nd=state.rounds[r+1][i>>1];if(i%2===0)nd.a=d.w;else nd.b=d.w}else state.champ=d.w;
  if(!silent)updateBets();
}
function updateBets(){
  const old=state.bettors.map(b=>b.n);
  state.bettors.forEach(b=>{b.delta=0;b.gain=Math.random()<.45?Math.round((40+Math.random()*260)/10)*10:0;b.amt+=b.gain});
  state.bettors.sort((x,y)=>y.amt-x.amt);
  state.bettors.forEach((b,i)=>{b.delta=old.indexOf(b.n)-i});
}
function card(d,cur){
  const P=i=>i===null?`<div class="p tbd"><span class="name">?</span><span class="n"></span></div>`:
    `<div class="p ${d.w===null?'':(d.w===i?'win':'lose')}"><span class="name">${state.players[i].n}</span><span class="n">n°${state.players[i].num}</span></div>`;
  return `<div class="duel${cur?' cur':''}">${P(d.a)}${P(d.b)}</div>`;
}
function render(first){
  const br=document.getElementById('bracket');
  br.querySelectorAll('.col').forEach(c=>c.remove());
  const cur=current();
  ROUNDS.forEach((R,r)=>{
    const col=document.createElement('div');col.className='col';
    col.innerHTML=`<div class="colhead"><b>${R.name}</b><span class="prime">${R.prime.toLocaleString('fr-FR')} $<small>si éliminé</small></span><span class="phase">${R.phase}</span></div>
      <div class="slots">${state.rounds[r].map((d,i)=>card(d,cur&&cur[0]===r&&cur[1]===i)).join('')}</div>`;
    br.appendChild(col);
  });
  const col=document.createElement('div');col.className='col';
  const c=state.champ;
  col.innerHTML=`<div class="colhead"><b>Vainqueur</b><span class="prime">${WIN_PRIME.toLocaleString('fr-FR')} $</span><span class="phase" style="visibility:hidden">·</span></div>
    <div class="slots"><div class="champ${c===null?' empty':''}"><div class="name">${c===null?'?':state.players[c].n}</div></div></div>`;
  br.appendChild(col);
  // bandeau duel en cours
  const live=document.getElementById('live');
  if(cur){const d=state.rounds[cur[0]][cur[1]];live.innerHTML=`<span class="tag">${ROUNDS[cur[0]].phase==='Numéros'?'DUEL':'FACE-À-FACE'}</span><span>${state.players[d.a].n}</span><span class="vs">vs</span><span>${state.players[d.b].n}</span>`}
  else live.innerHTML=`<span class="tag">TERMINÉ</span><span>${state.players[state.champ].n} remporte la prime</span>`;
  requestAnimationFrame(wires);
  renderBoard(first);
}
function wires(){
  const br=document.getElementById('bracket'),svg=document.getElementById('wires');
  const B=br.getBoundingClientRect();
  const cols=[...br.querySelectorAll('.col')].map(c=>[...c.querySelectorAll('.duel,.champ')]);
  let out='';
  for(let r=0;r<cols.length-1;r++){
    cols[r].forEach((el,i)=>{
      const tgt=cols[r+1][i>>1];if(!tgt)return;
      const a=el.getBoundingClientRect(),t=tgt.getBoundingClientRect();
      const x1=a.right-B.left,y1=a.top+a.height/2-B.top,x2=t.left-B.left,y2=t.top+t.height/2-B.top,mx=(x1+x2)/2;
      const d=r<4?state.rounds[r][i]:null;const done=d&&d.w!==null;
      out+=`<path d="M${x1} ${y1}H${mx}V${y2}H${x2}" fill="none" stroke="${done?'#e0a940':'#4a3824'}" stroke-width="${done?2:1.5}"/>`;
    });
  }
  svg.innerHTML=out;
}
// Classement parieurs avec animation de glissement (FLIP)
function renderBoard(first){
  const ol=document.getElementById('board');
  const before={};ol.querySelectorAll('.row').forEach(li=>before[li.dataset.n]=li.getBoundingClientRect().top);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  ol.innerHTML=state.bettors.slice(0,10).map((b,i)=>{
    const cls=first||!b.delta?'':(b.delta>0?'up':'down');
    const dl=first||!b.delta?'':(b.delta>0?`▲ ${b.delta}`:`▼ ${-b.delta}`);
    return `<li class="row ${cls}" data-n="${b.n}"><span class="rk">${i+1}</span><span class="nm">${b.n}</span><span class="amt">${b.amt.toLocaleString('fr-FR')} $</span><span class="delta ${cls}${dl?' show':''}">${dl}</span></li>`}).join('');
  if(first||reduce)return;
  ol.querySelectorAll('.row').forEach(li=>{
    const old=before[li.dataset.n];if(old===undefined)return;
    const dy=old-li.getBoundingClientRect().top;if(!dy)return;
    li.animate([{transform:`translateY(${dy}px)`},{transform:'translateY(0)'}],{duration:900,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
  clearTimeout(renderBoard.t);
  renderBoard.t=setTimeout(()=>ol.querySelectorAll('.row').forEach(li=>{li.classList.remove('up','down');li.querySelector('.delta').classList.remove('show')}),4500);
}
document.getElementById('next').addEventListener('click',()=>{const c=current();if(!c)return;resolve(c[0],c[1],Math.random()<.5?0:1);render(false)});
document.getElementById('reset').addEventListener('click',()=>init());
addEventListener('resize',()=>requestAnimationFrame(wires));
init();
</script>
